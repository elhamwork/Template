name: Deploy to GitHub Pages

# A GitHub Pages site serves a single deployment per repo, so both
# templates are built here and combined into one artifact:
#   /                          -> Cornerstone Roofing Co. (single-page template)
#   /roofing-siding-template/  -> Ironclad Roofing & Siding (multi-page template)

on:
  push:
    branches:
      - main
      - claude/roofing-company-template-5iz5wf
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install & build — Cornerstone Roofing Co. (root template)
        run: |
          npm ci
          npm run build

      - name: Install & build — Ironclad Roofing & Siding (multi-page template)
        working-directory: roofing-siding-template
        run: |
          npm ci
          npm run build

      - name: Combine builds into one deployable site
        run: |
          mkdir -p combined
          cp -r dist/. combined/
          mkdir -p combined/roofing-siding-template
          cp -r roofing-siding-template/dist/. combined/roofing-siding-template/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: combined

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
